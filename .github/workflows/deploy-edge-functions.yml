# Deploys Supabase Edge Functions whenever they change on main, so the
# deployed code can never drift from the repo again (the Oct 2026 audit
# found validate-apple-receipt running a months-old version).
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — e.g. npdlbtnyivawjaqgvpkt
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          supabase functions deploy sync-directory         --project-ref "$PROJECT_REF"
          supabase functions deploy check-application-urls --project-ref "$PROJECT_REF"
          # Verifies the caller's JWT itself so it can return JSON errors.
          supabase functions deploy validate-apple-receipt --project-ref "$PROJECT_REF" --no-verify-jwt
