name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests never hit the network, but lib/supabase.ts refuses to load
      # without these — dummy values keep any accidental import honest.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + regression tests
        run: npm test
      - name: Dead code / unused dependencies (knip)
        run: npm run knip
      - name: Expo SDK dependency alignment
        run: npx expo install --check

  edge-functions:
    name: Edge functions typecheck (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
